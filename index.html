<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus - Authentication</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #08090c;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

<!-- COMPACT SCROLL-SAFE CONTAINER -->
<div class="w-full max-w-[420px] flex flex-col px-5 pt-8 pb-12 box-border">
    
    <!-- TOP SECTION: LOGO + TABS -->
    <div class="w-full box-border">
        <!-- BRAND LOGO HEADER -->
        <div class="text-center mb-6">
            <div class="header-title text-2xl tracking-[5px] mb-1">NEXUS</div>
            <p class="text-[10px] text-gray-500 uppercase tracking-wider">Secure Access Node</p>
        </div>

        <!-- AUTH TABS SWITCHER -->
        <div class="flex bg-white/5 p-1 rounded-xl border border-white/5 mb-8 w-full box-border">
            <button id="tab-btn-login" class="flex-1 py-2.5 text-xs font-semibold rounded-lg text-indigo-400 bg-white/5 transition-all cursor-pointer" onclick="toggleAuthTab('login')">
                Login
            </button>
            <button id="tab-btn-register" class="flex-1 py-2.5 text-xs font-semibold rounded-lg text-gray-400 transition-all cursor-pointer" onclick="toggleAuthTab('register')">
                Register
            </button>
        </div>
    </div>

    <!-- MIDDLE SECTION: COMPACT FORMS -->
    <div class="w-full box-border mb-10">
        
        <!-- ================= LOGIN FORM TAB ================= -->
        <form id="auth-login-form" onsubmit="return false;" class="flex flex-col gap-4 w-full box-border">

            <div class="premium-input-group w-full">
                <label>Registered Email String</label>
                <input type="email" id="login-email" placeholder="name@domain.com" class="premium-input w-full" required>
            </div>
            <div class="premium-input-group w-full">
                <label>Account Password</label>
                <input type="password" id="login-password" placeholder="••••••••" class="premium-input w-full" required>
            </div>
            <button type="submit" class="neon-btn mt-3 w-full py-3">Confirm & Connect</button>
        </form>

        <!-- ================= REGISTER FORM TAB ================= -->
        <form id="auth-register-form" class="flex flex-col gap-4 w-full box-border hidden">
            <div class="premium-input-group w-full">
                <label>Full Name</label>
                <input type="text" id="reg-name" placeholder="Enter Full Name" class="premium-input w-full" required>
            </div>
            <div class="premium-input-group w-full">
                <label>Enter Email Address</label>
                <input type="email" id="reg-email" placeholder="name@domain.com" class="premium-input w-full" required>
            </div>
            <div class="premium-input-group w-full">
                <label>Setup Secure Password</label>
                <input type="password" id="reg-password" placeholder="Min 6 characters" class="premium-input w-full" required>
            </div>
            <div class="premium-input-group w-full">
                <label>Confirm Password</label>
                <input type="password" id="reg-confirm-password" placeholder="Repeat password" class="premium-input w-full" required>
            </div>
            <button type="submit" class="neon-btn mt-3 w-full py-3">Save & Continue</button>
        </form>

    </div>

    <!-- BOTTOM SECTION: VISIBLE HELP & SUPPORT -->
    <div class="w-full text-center pt-5 border-t border-white/5 box-border mt-2">
        <h4 class="text-[10px] font-semibold text-gray-400 uppercase tracking-widest mb-2">Help & Support</h4>
        <div class="flex flex-col gap-1 text-xs text-gray-500">
            <p>Email: <a href="mailto:santoshking471@gmail.com" class="text-indigo-400 hover:underline">santoshking471@gmail.com</a></p>
            <p>WhatsApp: <a href="https://wa.me/918817409243" target="_blank" class="text-emerald-400 hover:underline">+91 88174 09243</a></p>
        </div>
    </div>

</div>

<!-- FIREBASE SDK INTEGRATION MODULES -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, query, collection, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyB9wfUyckilfi9k1utVJPBoUTg9i62GFGM",
  authDomain: "nexus-94a75.firebaseapp.com",
  projectId: "nexus-94a75",
  storageBucket: "nexus-94a75.firebasestorage.app",
  messagingSenderId: "817223121489",
  appId: "1:817223121489:web:bf808da433ba87cbb95670",
  measurementId: "G-KGDL0VWS01"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.toggleAuthTab = function(mode) {
        const loginForm = document.getElementById('auth-login-form');
        const regForm = document.getElementById('auth-register-form');
        const loginBtn = document.getElementById('tab-btn-login');
        const regBtn = document.getElementById('tab-btn-register');

        if (mode === 'login') {
            loginForm.classList.remove('hidden');
            regForm.classList.add('hidden');
            loginBtn.classList.add('bg-white/5', 'text-indigo-400');
            loginBtn.classList.remove('text-gray-400');
            regBtn.classList.remove('bg-white/5', 'text-indigo-400');
            regBtn.classList.add('text-gray-400');
        } else {
            regForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            regBtn.classList.add('bg-white/5', 'text-indigo-400');
            regBtn.classList.remove('text-gray-400');
            loginBtn.classList.remove('bg-white/5', 'text-indigo-400');
            loginBtn.classList.add('text-gray-400');
        }
    }

    function generateRefCode() {
        return "NEX" + Math.floor(100 + Math.random() * 900) + "K";
    }

    document.getElementById('auth-login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        try {
            const q = query(collection(db, "users"), where("email", "==", email));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                alert("User not found");
                return;
            }

            await signInWithEmailAndPassword(auth, email, password);
            window.location.href = "index.html";

        } catch (error) {
            alert("Login fail : pls check your email and password");
            console.error(error.message);
        }
    });

    document.getElementById('auth-register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirmPassword = document.getElementById('reg-confirm-password').value;

        if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        try {
            const q = query(collection(db, "users"), where("email", "==", email));
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                alert("User already registered");
                return;
            }

            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            await setDoc(doc(db, "users", user.uid), {
                uid: user.uid,
                fullName: name,
                email: email,
                referralId: generateRefCode(),
                todayEarning: 0,
                totalEarning: 0,
                completed: 0,
                pending: 0,
                walletBalance: 0
            });

            window.location.href = "home.html";

        } catch (error) {
            alert("Registration failed: " + error.message);
        }
    });
</script>
</body>
</html>
